services:
  proxy:
    image: nginx:mainline
    container_name: ${COMPOSE_PROJECT_NAME}-proxy
    restart: always
    ports:
      - "80:80"
    networks:
      - local
    volumes:
      - ./proxy.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    image: postgres:14
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: main
    restart: always
    volumes:
      - ${COMPOSE_PROJECT_NAME}_db:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}"
    networks:
      - local
    command: -p ${POSTGRES_PORT:-5432}

networks:
  local:
    driver: bridge

volumes:
  local_db:
  flow_tests_db:
