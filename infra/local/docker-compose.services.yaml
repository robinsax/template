# Reusable env params.
x-env-origin: &env-origin
  SERVICE_ORIGIN: http://localhost

x-env-pg: &env-pg
  POSTGRES_URI: postgresql://admin:admin@${COMPOSE_PROJECT_NAME}-postgres:${POSTGRES_PORT:-5432}/main

x-env-adapters: &env-adapters
  # Storage.
  STORAGE_BACKEND: google
  GOOGLE_BUCKET_DEFAULT: ${PROJECT_NAME}-local-data
  # AI.
  AI_PROVIDER: gemini
  GEMINI_DEV_API_KEY: ${GEMINI_DEV_API_KEY}

x-env-secrets: &env-secrets
  # Keys.
  ENCRYPTION_KEY: xn7MwEMY1l7G9dItXwzn5F6NK80WrSuv_n2lSKXDwHc=
  AUTH_TOKEN_HMAC_KEY: rjv40P742AP_16-Z2VOR3nJibqVrn9R6qyvEq3fwkBo=

x-env-gcp-sa: &env-gcp-sa
  GOOGLE_APPLICATION_CREDENTIALS: /creds/gcp-sa.json

# Resuable service template params.
x-gcp-sa-mount: &gcp-sa-mount
  ../../common/gcp-sa.json:/creds/gcp-sa.json

# Services.
services:
  proxy:
    extends:
      file: docker-compose.dependencies.yaml
      service: proxy

  postgres:
    extends:
      file: docker-compose.dependencies.yaml
      service: postgres

  app:
    image: ${PROJECT_NAME}/app:latest
    container_name: ${COMPOSE_PROJECT_NAME}-app
    build:
      context: ../../app
      target: app
    environment:
      <<: *env-origin
      SERVICE_PORT: 8000
    ports:
      - 8000:8000
    networks:
      - local

  api:
    image: ${PROJECT_NAME}/api:latest
    container_name: ${COMPOSE_PROJECT_NAME}-api
    build:
      context: ../../backend
      target: api
    environment:
      <<: [*env-origin, *env-pg, *env-adapters, *env-secrets, *env-gcp-sa]
      SERVICE_PORT: ${API_PORT:-8001}
      FLOW_TEST_MODE: ${FLOW_TEST_MODE:-false}
    ports:
      - ${API_PORT:-8001}:${API_PORT:-8001}
    volumes: [
      *gcp-sa-mount,
      ../../backend/.storage:/app/.storage:rw
    ]
    networks:
      - local

networks:
  local:
    driver: bridge

volumes:
  db:
  flow_tests_db:
